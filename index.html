<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Farmacia de Turno - Comandante Andresito</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            /* COLOR TIPO WINDOWS/TEAL MODERNO */
            --primary: #72bd99; 
            --primary-hover: #5da684;
            --bg-body: #ffffff; /* Fondo blanco puro para contraste */
            --card-bg: #fafafa; /* Blanco suave para el recuadro */
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(0, 0, 0, 0.03);
            --radius-lg: 32px; /* Un poco más curvo, más premium */
            --radius-md: 18px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            min-height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            color: var(--text-main);
            overflow: hidden;
        }

        .card {
            background: linear-gradient(180deg, rgba(20, 28, 42, 0.86), rgba(11, 18, 29, 0.86));
            width: 94vw;
            max-width: 420px;
            height: auto;
            max-height: 90vh;
            border-radius: var(--radius-lg);
            padding: 18px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.35), 0 10px 26px rgba(0, 0, 0, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.14);
            text-align: center;
            position: relative;
            animation: fadeInFloating 0.8s ease-out;
            overflow-y: auto;
            color: #f8fafc;
            z-index: 2;
        }

        .emoji-layer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .emoji-floating {
            position: absolute;
            user-select: none;
            transform-origin: center;
            animation: float-drift linear infinite, rotate-drift linear infinite;
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.15));
        }

        @keyframes float-drift {
            0%   { transform: translateY(0)    translateX(0)    scale(1);   }
            25%  { transform: translateY(-12vh) translateX(6vw)  scale(1.12); }
            50%  { transform: translateY(-6vh)  translateX(-5vw) scale(0.95); }
            75%  { transform: translateY(-16vh) translateX(3vw)  scale(1.08); }
            100% { transform: translateY(0)    translateX(0)    scale(1);   }
        }

        @keyframes rotate-drift {
            0%   { rotate: 0deg; }
            100% { rotate: 360deg; }
        }
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.08;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            animation: curtainGoReverse 14s linear infinite;
            pointer-events: none;
            letter-spacing: 12px;
            white-space: nowrap;
            z-index: 0;
        }

        @keyframes curtainGo {
            0% { transform: translate(-20%, -10%) rotate(0deg); }
            50% { transform: translate(20%, 15%) rotate(180deg); }
            100% { transform: translate(-20%, -10%) rotate(360deg); }
        }

        @keyframes curtainGoReverse {
            0% { transform: translate(20%, 10%) rotate(360deg); }
            50% { transform: translate(-20%, -15%) rotate(180deg); }
            100% { transform: translate(20%, 10%) rotate(0deg); }
        }

        @media (min-width: 481px) {
            body {
                padding: 24px;
            }

            .card {
                width: 100%;
                max-width: 420px;
                height: auto;
                border-radius: var(--radius-lg);
                padding: 56px 36px;
                box-shadow: 
                    0 4px 6px -1px rgba(0, 0, 0, 0.05),
                    0 10px 20px -5px rgba(0, 0, 0, 0.1),
                    0 30px 45px -10px rgba(0, 0, 0, 0.15),
                    inset 0 1px 1px rgba(255, 255, 255, 0.9);
                border: 1px solid var(--border-color);
                justify-content: flex-start;
                overflow-y: visible;
            }
        }

        @media (orientation: landscape) and (max-width: 900px) {
            body {
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            .card {
                width: 90vw;
                max-width: 580px;
                height: 84vh;
                max-height: 84vh;
                min-height: 70vh;
                border-radius: 20px;
                padding: 14px;
                justify-content: space-between;
            }

            h1 { font-size: 2rem; margin-bottom: 6px; }
            .nombre-farmacia { font-size: 1.9rem; margin-bottom: 12px; }
            .fecha { font-size: 0.9rem; padding: 10px 12px; margin-bottom: 10px; }
            .btn { padding: 10px; margin-bottom: 8px; font-size: 0.92rem; }
            .info { margin-bottom: 8px; padding: 0 6px; }
            .logo-municipio { height: 36px; margin-bottom: 5px; }
        }

        .logo-municipio {
            height: 96px;
            margin: 0 auto 10px auto;
            object-fit: contain;
            opacity: 1;
            max-width: 90%;
            display: block;
        }

        .localidad {
            font-size: 0.75rem;
            font-weight: 700;
            color: #e0f7f0;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #ffffff;
            margin-bottom: 8px;
            line-height: 1.1;
        }

        .info {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #e2ecf5;
            margin-bottom: 12px;
            padding: 0 6px;
        }

        .fecha {
            background-color: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.24);
            padding: 10px 16px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            color: #ffffff;
            margin-bottom: 12px;
            display: inline-block;
        }

        .logo-red {
            height: 110px;
            margin: 0 auto 16px auto;
            opacity: 1;
            object-fit: contain;
            max-width: 95%;
            display: block;
        }

        .nombre-farmacia {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(90deg, rgba(255,255,255,1) 20%, rgba(255,215,0,0.95) 40%, rgba(255,255,255,1) 60%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: oroShine 3s infinite linear;
            margin-bottom: 20px;
            min-height: 45px;
            letter-spacing: -0.01em;
            line-height: 1.2;
        }

        @keyframes oroShine {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 200% 50%;
            }
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 12px;
            margin-bottom: 10px;
        }

        @media (min-width: 481px) {
            .logo-municipio {
                margin-bottom: 28px;
            }

            h1 {
                font-size: 1.9rem;
            }

            .info {
                margin-bottom: 36px;
            }

            .fecha {
                margin-bottom: 45px;
            }

            .nombre-farmacia {
                font-size: 1.7rem;
                margin-bottom: 45px;
                min-height: 42px;
            }

            .btn {
                padding: 20px;
                margin-bottom: 16px;
            }
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-maps {
            background-color: #4b9f81;
            color: #ffffff;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.26);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-maps:hover {
            background-color: #3f8a6f;
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.38);
        }

        .btn-wpp {
            background-color: #32c272;
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 2px 6px rgba(0,0,0,0.28);
        }
        .btn-wpp:hover {
            background-color: #f8fafc;
            border-color: rgba(0, 0, 0, 0.12);
        }

        /* Confetti lluvia */
        .confetti {
            position: fixed;
            top: -20px;
            width: 8px;
            height: 8px;
            opacity: 0.85;
            z-index: 1;
            pointer-events: none;
            animation: caerLluvia linear forwards;
        }

        @keyframes caerLluvia {
            0% {
                transform: translateY(0) rotate(0deg);
            }
            100% {
                transform: translateY(120vh) rotate(360deg);
            }
        }

        /* Footer casi invisible */
        .footer {
            margin-top: auto;
            padding-top: 12px;
            font-size: 0.6rem;
            color: var(--text-muted);
            opacity: 0.25;
            font-weight: 500;
            letter-spacing: 0.03em;
            text-align: center;
        }

        @media (min-width: 481px) {
            .footer {
                margin-top: 45px;
                padding-top: 0;
                font-size: 0.72rem;
            }
        }

        /* Animación de entrada con ligero "rebote" */
        @keyframes fadeInFloating {
            0% { opacity: 0; transform: translateY(30px) scale(0.98); }
            70% { opacity: 1; transform: translateY(-5px) scale(1.00); }
            100% { opacity: 1; transform: translateY(0) scale(1.00); }
        }

        /* ── Badge Red Farmako ── */
        .rmk-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #ffffff;
            border-radius: 10px;
            padding: 7px 14px;
            margin: 14px auto 0 auto;
            width: fit-content;
            animation: rmkGlow 3s ease-in-out infinite alternate;
        }

        .rmk-badge-logo {
            height: 28px;
            object-fit: contain;
            opacity: 0.88;
            filter: brightness(0) invert(35%);
        }

        .rmk-badge-text {
            font-size: 0.65rem;
            font-weight: 500;
            color: #2d6a4f;
            white-space: nowrap;
            letter-spacing: 0.01em;
        }

        .rmk-badge-brand {
            font-size: 0.78rem;
            font-weight: 800;
            background: linear-gradient(90deg, #1e8a52 0%, #72bd99 30%, #1e8a52 55%, #72bd99 80%, #1e8a52 100%);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rmkShine 2.4s infinite linear;
            letter-spacing: 0.02em;
        }

        @keyframes rmkShine {
            0%   { background-position: 100% 50%; }
            100% { background-position: -100% 50%; }
        }

        @keyframes rmkGlow {
            from { box-shadow: 0 2px 8px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05); }
            to   { box-shadow: 0 4px 18px rgba(50,180,105,0.30), 0 0 0 1px rgba(50,180,105,0.18); }
        }
    </style>
</head>
<body>

<div class="card">
    <img src="img/logo-andresito.png" class="logo-municipio" alt="Logo Municipio">

    <div class="localidad">
        Comandante Andresito
    </div>

    <h1>Farmacia de Turno</h1>

    <p class="info">
        Los turnos comienzan a las 08:00 AM. y finalizan a las 08:00 AM. del día siguiente.<br>
    </p>

    <div id="fecha" class="fecha"></div>

    <img src="img/redfarmako.png" class="logo-red" alt="Red Farmako">

    <div id="nombre-farmacia" class="nombre-farmacia">
        Cargando...
    </div>

    <button id="btn-maps" class="btn btn-maps">
        <i class="fa-solid fa-location-dot"></i>
        Cómo llegar
    </button>

    <button id="btn-wpp" class="btn btn-wpp">
        <i class="fa-brands fa-whatsapp"></i>
        WhatsApp
    </button>

    <div class="rmk-badge">
        <img src="img/redfarmako.png" class="rmk-badge-logo" alt="Red Farmako">
        <span class="rmk-badge-text">Información brindada por&nbsp;<span class="rmk-badge-brand">Red Farmako</span></span>
    </div>

    <footer class="footer">
        © 2026 Braulio · Comandante Andresito
    </footer>
</div>

<div class="emoji-layer" id="emoji-layer"></div>

<script>
    const emojis = ['⏰','💊','🏥','⏱️','🧾','💉','🩺','💊','🌡️','🔬','🩹','❤️‍🩹','🫀','🧬','🩻','⚕️'];
    const layer = document.getElementById('emoji-layer');

    for (let i = 0; i < 55; i++) {
        const emojiDiv = document.createElement('div');
        emojiDiv.className = 'emoji-floating';
        emojiDiv.innerText = emojis[Math.floor(Math.random()*emojis.length)];

        // Mezcla de tamaños: algunos grandes destacados, mayoría medianos
        const grande = Math.random() < 0.2;
        const size = grande ? (2.2 + Math.random() * 1.2) : (0.9 + Math.random() * 1.1);
        emojiDiv.style.fontSize = `${size}rem`;
        emojiDiv.style.top  = `${Math.random() * 100}%`;
        emojiDiv.style.left = `${Math.random() * 100}%`;

        const duration = 7 + Math.random() * 10;
        const delay = Math.random() * -duration;
        emojiDiv.style.animationDuration = `${duration}s, ${10 + Math.random() * 8}s`;
        emojiDiv.style.animationDelay = `${delay}s, ${delay}s`;
        // Opacidad variada: algunos más visibles que otros
        const opacidad = grande ? (0.18 + Math.random() * 0.18) : (0.10 + Math.random() * 0.14);
        emojiDiv.style.opacity = opacidad.toString();

        layer.appendChild(emojiDiv);
    }
</script>

</html>
