<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Farmacia de Turno - Comandante Andresito</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#72bd99">
    <link rel="apple-touch-icon" href="img/logo-andresito.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #72bd99; 
            --primary-hover: #5da684;
            --bg-body: #0a1628;
            --card-bg: rgba(20, 30, 48, 0.85);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(255, 255, 255, 0.08);
            --radius-lg: 32px;
            --radius-md: 18px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(45, 120, 100, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(30, 60, 90, 0.35) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(15, 40, 60, 0.5) 0%, transparent 70%),
                linear-gradient(160deg, #0a1628 0%, #0f2338 40%, #0a1628 100%);
            background-attachment: fixed;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            color: var(--text-main);
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(114, 189, 153, 0.06) 0%, transparent 25%),
                radial-gradient(circle at 80% 70%, rgba(80, 160, 200, 0.05) 0%, transparent 30%),
                radial-gradient(circle at 60% 20%, rgba(100, 180, 150, 0.04) 0%, transparent 20%);
            pointer-events: none;
            z-index: 0;
            animation: auroraFloat 20s ease-in-out infinite;
        }

        @keyframes auroraFloat {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 1; }
            50% { transform: translate(-2%, 2%) scale(1.05); opacity: 0.8; }
        }

        .card {
            background: 
                linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.04) 50%, rgba(255,255,255,0.08) 100%),
                linear-gradient(180deg, rgba(30, 45, 65, 0.95) 0%, rgba(15, 28, 45, 0.95) 100%);
            width: 94vw;
            max-width: 420px;
            height: calc(100vh - 20px);
            height: calc(100dvh - 20px);
            max-height: calc(100vh - 20px);
            max-height: calc(100dvh - 20px);
            border-radius: var(--radius-lg);
            padding: clamp(8px, 1.2vh, 14px) 14px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            box-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.6),
                0 15px 30px -10px rgba(0, 0, 0, 0.5),
                0 0 80px rgba(114, 189, 153, 0.08),
                inset 0 1px 1px rgba(255, 255, 255, 0.15),
                inset 0 -2px 4px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.12);
            text-align: center;
            position: relative;
            animation: fadeInFloating 0.8s ease-out;
            overflow-y: auto;
            color: #f8fafc;
            z-index: 2;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: box-shadow 0.3s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: calc(var(--radius-lg) + 1px);
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.05) 30%, rgba(114, 189, 153, 0.3) 70%, rgba(255,255,255,0.15) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: shimmerBorder 4s linear infinite;
        }

        @keyframes shimmerBorder {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .card::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        .card.layout-compact {
            padding: 20px 18px;
        }

        .card.layout-tight {
            padding: 16px 14px 18px;
        }

        .card.layout-compact .logo-municipio,
        .card.layout-tight .logo-municipio {
            height: 66px;
            margin-bottom: 6px;
        }

        .card.layout-tight .logo-municipio {
            height: 58px;
            margin-bottom: 4px;
        }

        .card.layout-compact h1,
        .card.layout-tight h1 {
            font-size: 1.92rem;
            margin-bottom: 6px;
        }

        .card.layout-tight h1 {
            font-size: 1.72rem;
        }

        .card.layout-compact .info,
        .card.layout-tight .info {
            font-size: 0.88rem;
            margin-bottom: 12px;
        }

        .card.layout-tight .info {
            font-size: 0.82rem;
            margin-bottom: 10px;
        }

        .card.layout-compact .fecha,
        .card.layout-tight .fecha {
            margin-bottom: 10px;
            padding: 9px 14px;
        }

        .card.layout-tight .fecha {
            margin-bottom: 8px;
            padding: 8px 12px;
            font-size: 0.82rem;
        }

        .card.layout-compact .logo-red-wrapper,
        .card.layout-tight .logo-red-wrapper {
            padding: 2px 0 10px;
            margin-bottom: 0;
        }

        .card.layout-tight .logo-red-wrapper {
            padding: 2px 0 8px;
        }

        .card.layout-compact .nombre-farmacia,
        .card.layout-tight .nombre-farmacia {
            font-size: 1.6rem; /* Reducido un poco para dar espacio al logo */
            margin-bottom: 16px;
            min-height: 0;
            margin-top: 0px; /* Pegamos el texto al logo */
        }

        .card.layout-tight .nombre-farmacia {
            font-size: 1.42rem;
            margin-bottom: 12px;
            margin-top: 0px; /* Pegamos el texto al logo */
        }


        .card.layout-compact .btn,
        .card.layout-tight .btn {
            padding: 14px;
            margin-bottom: 9px;
        }

        .card.layout-tight .btn {
            padding: 12px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            gap: 10px;
        }

        .card.layout-compact .rmk-badge,
        .card.layout-tight .rmk-badge {
            margin-top: 10px;
            padding: 8px 18px;
        }

        .card.layout-tight .rmk-badge {
            margin-top: 8px;
            padding: 7px 16px;
        }

        .card.layout-tight .rmk-badge-text {
            font-size: 0.62rem;
        }

        .card.layout-tight .rmk-badge-brand {
            font-size: 0.76rem;
        }

        .card.layout-compact .footer,
        .card.layout-tight .footer {
            margin-top: 14px;
        }

        .card.layout-tight .footer {
            margin-top: 10px;
            font-size: 0.58rem;
        }

        .emoji-layer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .emoji-floating {
            position: absolute;
            user-select: none;
            transform-origin: center;
            animation: float-drift linear infinite, rotate-drift linear infinite;
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.15));
        }

        @keyframes float-drift {
            0%   { transform: translateY(0)    translateX(0)    scale(1);   }
            25%  { transform: translateY(-12vh) translateX(6vw)  scale(1.12); }
            50%  { transform: translateY(-6vh)  translateX(-5vw) scale(0.95); }
            75%  { transform: translateY(-16vh) translateX(3vw)  scale(1.08); }
            100% { transform: translateY(0)    translateX(0)    scale(1);   }
        }

        @keyframes rotate-drift {
            0%   { rotate: 0deg; }
            100% { rotate: 360deg; }
        }

        @keyframes curtainGo {
            0% { transform: translate(-20%, -10%) rotate(0deg); }
            50% { transform: translate(20%, 15%) rotate(180deg); }
            100% { transform: translate(-20%, -10%) rotate(360deg); }
        }

        @keyframes curtainGoReverse {
            0% { transform: translate(20%, 10%) rotate(360deg); }
            50% { transform: translate(-20%, -15%) rotate(180deg); }
            100% { transform: translate(20%, 10%) rotate(0deg); }
        }

        /* ── 3-section card layout ── */
        .card-header {
            flex-shrink: 0;
        }

        .card-turno {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(2px, 0.6vh, 8px) 0;
            gap: clamp(6px, 1.6vh, 14px);
        }

        .card-actions {
            flex-shrink: 0;
        }

        @media (min-width: 481px) {
            body {
                padding: 24px;
            }

            .card {
                width: 100%;
                max-width: 420px;
                height: auto;
                max-height: min(92vh, 760px);
                border-radius: var(--radius-lg);
                padding: 28px 24px 22px;
                box-shadow:
                    0 4px 6px -1px rgba(0, 0, 0, 0.05),
                    0 10px 20px -5px rgba(0, 0, 0, 0.1),
                    0 30px 45px -10px rgba(0, 0, 0, 0.15),
                    inset 0 1px 1px rgba(255, 255, 255, 0.9);
                border: 1px solid var(--border-color);
                justify-content: flex-start;
                overflow-y: auto;
            }
        }

        @media (max-height: 820px) {
            body { padding: 10px; }
            .card { padding: 12px 14px 12px; }
        }

        @media (orientation: landscape) and (max-width: 900px) {
            body { overflow-y: auto; padding: 10px; }
            .card {
                width: 96vw;
                max-width: 640px;
                height: calc(100vh - 20px);
                height: calc(100dvh - 20px);
                max-height: calc(100dvh - 20px);
                border-radius: 20px;
                padding: 10px 14px;
                justify-content: flex-start;
            }
            .card-turno { padding: 2px 0; gap: 4px; }
            .logo-municipio { height: clamp(30px, 5vh, 44px); margin-bottom: 2px; }
            .localidad { margin-bottom: 2px; }
            h1 { font-size: clamp(1.2rem, 3vh, 1.7rem); margin-bottom: 2px; }
            .info { font-size: 0.75rem; margin-bottom: 6px; }
            .fecha { padding: 7px 12px; margin-bottom: 4px; font-size: 0.8rem; }
            .turno-timer { margin-bottom: 6px; }
            .divider { margin: 4px 0 2px; }
            .logo-red-wrapper { height: clamp(50px, 10vh, 80px); }
            .logo-red { max-width: 100%; max-height: 100%; width: auto; height: auto; }
            .logo-red-wrapper { padding: 2px 0 6px; }
            .nombre-farmacia { font-size: clamp(1.2rem, 3.5vh, 1.6rem); margin-bottom: 6px; }
            .nombre-farmacia--rmk { font-size: clamp(1.2rem, 4vh, 2rem); }
            .btn { padding: 10px; margin-bottom: 6px; font-size: 0.88rem; }
            .rmk-badge { padding: 6px 14px; margin-top: 4px; }
            .footer { margin-top: 4px; }
        }

        .logo-municipio {
            height: clamp(72px, 12vh, 96px);
            margin: 0 auto clamp(4px, 0.8vh, 8px) auto;
            object-fit: contain;
            opacity: 1;
            max-width: 90%;
            display: block;
        }

        .localidad {
            font-size: clamp(0.62rem, 1.6vw, 0.72rem);
            font-weight: 700;
            color: #e0f7f0;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: clamp(1px, 0.4vh, 3px);
        }

        h1 {
            font-size: clamp(1.1rem, 5.5vw, 2.2rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #ffffff;
            margin-bottom: clamp(3px, 0.6vh, 6px);
            line-height: 1.1;
            text-shadow: 0 0 30px rgba(114, 189, 153, 0.3), 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .info {
            font-size: clamp(0.7rem, 1.8vw, 0.84rem);
            line-height: 1.35;
            color: #e2ecf5;
            margin-bottom: clamp(6px, 1.1vh, 10px);
            padding: 0 4px;
        }

        .fecha {
            background-color: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.24);
            padding: clamp(5px, 0.9vh, 9px) 14px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: clamp(0.78rem, 2vw, 0.88rem);
            color: #ffffff;
            margin-bottom: clamp(4px, 0.8vh, 7px);
            display: inline-block;
        }

        .turno-timer {
            font-size: clamp(0.72rem, 1.9vw, 0.8rem);
            color: rgba(114, 189, 153, 0.9);
            margin-bottom: clamp(3px, 0.6vh, 7px);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(114, 189, 153, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(114, 189, 153, 0.2);
            animation: timerFade 0.5s ease;
        }

        @keyframes timerFade {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .turno-timer i {
            font-size: 0.75rem;
        }

        .turno-timer.urgente {
            color: rgba(255, 180, 100, 0.95);
            background: rgba(255, 180, 100, 0.12);
            border-color: rgba(255, 180, 100, 0.3);
            animation: timerPulse 1s ease-in-out infinite;
        }

        @keyframes timerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }


        .logo-red-wrapper {
            position: relative;
            width: 92%;
            height: clamp(60px, 13vh, 110px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-red-wrapper::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 24px;
            border-radius: 50%;
            background: rgba(114, 189, 153, 0.3);
            filter: blur(20px);
            animation: haloGlow 2.8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        .logo-red {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            position: relative;
            z-index: 1;
            animation: rmkLogoReveal 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        .nombre-farmacia {
            font-size: clamp(1.4rem, 7vh, 2.8rem);
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(90deg, rgba(255,255,255,1) 20%, rgba(255,215,0,0.95) 40%, rgba(255,255,255,1) 60%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: oroShine 3s infinite linear;
            margin-bottom: 0;
            min-height: 0;
            letter-spacing: -0.01em;
            line-height: 1.2;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.3));
        }

        @keyframes oroShine {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 200% 50%;
            }
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: clamp(11px, 2vh, 16px);
            border-radius: var(--radius-md);
            font-size: clamp(0.86rem, 2.2vw, 0.95rem);
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 12px;
            margin-bottom: clamp(7px, 1.1vh, 10px);
        }

        @media (min-width: 481px) {
            .logo-municipio {
                height: 92px;
                margin-bottom: 16px;
            }

            h1 {
                font-size: 1.9rem;
            }

            .info {
                margin-bottom: 24px;
            }

            .fecha {
                margin-bottom: 24px;
            }

            .nombre-farmacia {
                font-size: 1.7rem;
                margin-bottom: 24px;
                min-height: 42px;
            }

            .btn {
                padding: 16px;
                margin-bottom: 12px;
            }
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:disabled {
            opacity: 0.56;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn:not(:disabled):active {
            transform: scale(0.95) translateY(1px);
            box-shadow: 
                0 2px 8px rgba(0, 0, 0, 0.2),
                inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .btn i {
            transition: transform 0.3s ease;
        }

        .btn:not(:disabled):hover i {
            transform: scale(1.15);
        }

        .btn-maps i {
            display: inline-block;
        }

        .btn-maps {
            background: linear-gradient(145deg, #3a8a6f, #2d6f55);
            color: #ffffff;
            box-shadow: 
                0 4px 16px rgba(0, 0, 0, 0.25),
                0 2px 6px rgba(58, 138, 111, 0.3),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        .btn-maps::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s ease;
        }

        .btn-maps:hover::before {
            left: 100%;
        }

        .btn-maps:hover {
            background: linear-gradient(145deg, #4a9a7f, #3d7f65);
            transform: translateY(-2px);
            box-shadow: 
                0 10px 28px rgba(0, 0, 0, 0.45),
                0 5px 12px rgba(58, 138, 111, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.25);
        }

        .btn-wpp {
            background: linear-gradient(145deg, #2dc773, #25a65a);
            color: #ffffff;
            box-shadow: 
                0 4px 16px rgba(0, 0, 0, 0.25),
                0 2px 6px rgba(45, 199, 115, 0.3),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        .btn-wpp::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.1);
            animation: btnPulse 2s ease-in-out infinite;
        }

        @keyframes btnPulse {
            0%, 100% { transform: scale(1); opacity: 0; }
            50% { transform: scale(1.02); opacity: 0.3; }
        }

        .btn-wpp:hover {
            background: linear-gradient(145deg, #3ed783, #2cb66a);
            transform: translateY(-2px);
            box-shadow: 
                0 8px 24px rgba(0, 0, 0, 0.35),
                0 4px 10px rgba(45, 199, 115, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.25);
        }

        /* Confetti lluvia */
        .confetti {
            position: fixed;
            top: -20px;
            width: 8px;
            height: 8px;
            opacity: 0.85;
            z-index: 1;
            pointer-events: none;
            animation: caerLluvia linear forwards;
        }

        @keyframes caerLluvia {
            0% {
                transform: translateY(0) rotate(0deg);
            }
            100% {
                transform: translateY(120vh) rotate(360deg);
            }
        }

        /* Footer casi invisible */
        .footer {
            margin-top: clamp(4px, 0.8vh, 10px);
            padding-top: 0;
            font-size: clamp(0.52rem, 1.5vw, 0.6rem);
            color: var(--text-muted);
            opacity: 0.25;
            font-weight: 500;
            letter-spacing: 0.03em;
            text-align: center;
        }

        @media (min-width: 481px) {
            .footer {
                margin-top: 24px;
                padding-top: 0;
                font-size: 0.72rem;
            }
        }

        /* Animación de entrada con ligero "rebote" */
        @keyframes fadeInFloating {
            0% { opacity: 0; transform: translateY(30px) scale(0.98); }
            70% { opacity: 1; transform: translateY(-5px) scale(1.00); }
            100% { opacity: 1; transform: translateY(0) scale(1.00); }
        }

        /* ── Badge Red Farmako ── */
        .rmk-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            background: linear-gradient(135deg, rgba(20, 35, 50, 0.9), rgba(10, 20, 35, 0.95));
            border: 1px solid rgba(114, 189, 153, 0.3);
            border-radius: 14px;
            padding: clamp(6px, 1vh, 10px) 18px;
            margin: clamp(6px, 1vh, 12px) auto 0 auto;
            width: fit-content;
            animation: rmkGlow 3s ease-in-out infinite alternate;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 
                0 4px 20px rgba(0, 0, 0, 0.3),
                0 0 20px rgba(114, 189, 153, 0.1),
                inset 0 1px 1px rgba(255,255,255,0.1);
        }

        .rmk-badge-text {
            font-size: 0.67rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 0 12px rgba(255,255,255,0.3), 0 1px 2px rgba(0,0,0,0.4);
            white-space: nowrap;
            letter-spacing: 0.03em;
        }

        .rmk-badge-brand {
            font-size: 0.80rem;
            font-weight: 800;
            background: linear-gradient(90deg, #ffffff 0%, #72bd99 30%, #ffffff 55%, #72bd99 80%, #ffffff 100%);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rmkShine 2.4s infinite linear;
            letter-spacing: 0.04em;
            text-shadow: 0 0 20px rgba(114, 189, 153, 0.5);
        }

        @keyframes rmkShine {
            0%   { background-position: 100% 50%; }
            100% { background-position: -100% 50%; }
        }

        @keyframes rmkGlow {
            from { 
                box-shadow: 0 4px 20px rgba(0,0,0,0.3), 0 0 15px rgba(114, 189, 153, 0.15), inset 0 1px 1px rgba(255,255,255,0.08);
                border-color: rgba(114, 189, 153, 0.2);
            }
            to   { 
                box-shadow: 0 6px 28px rgba(0,0,0,0.4), 0 0 30px rgba(114, 189, 153, 0.25), 0 0 8px rgba(114, 189, 153, 0.1), inset 0 1px 1px rgba(255,255,255,0.15);
                border-color: rgba(114, 189, 153, 0.4);
            }
        }

        /* Background Particles */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-particle {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(20px) rotate(360deg); opacity: 0; }
        }

        /* Loader */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(160deg, #0a1628 0%, #0f2338 50%, #0a1628 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .loader-icon {
            width: 70px;
            height: 70px;
            position: relative;
        }

        .pulse-icon {
            width: 100%;
            height: 100%;
            animation: clockPulse 1.5s ease-in-out infinite;
        }

        @keyframes clockPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .loader-icon::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px solid rgba(114, 189, 153, 0.2);
            animation: rippleLoader 1.5s ease-out infinite;
        }

        @keyframes rippleLoader {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .loader-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.1em;
            animation: textPulse 1.5s ease-in-out infinite;
        }

        @keyframes textPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Logo RMK: entrada dramática */
        @keyframes rmkLogoReveal {
            0%   { opacity: 0; transform: scale(0.68) translateY(14px); }
            70%  { opacity: 1; transform: scale(1.04) translateY(-3px); }
            100% { opacity: 1; transform: scale(1)    translateY(0); }
        }

        /* Halo bajo el logo */
        @keyframes haloGlow {
            0%, 100% { opacity: 0.55; transform: translateX(-50%) scaleX(1); }
            50%       { opacity: 1;    transform: translateX(-50%) scaleX(1.25); }
        }

        /* Card modo Red Farmako */
        .card--rmk {
            border-color: rgba(114, 189, 153, 0.32) !important;
            box-shadow:
                0 30px 60px -15px rgba(0, 0, 0, 0.6),
                0 15px 30px -10px rgba(0, 0, 0, 0.5),
                0 0 110px rgba(114, 189, 153, 0.18),
                0 0 45px  rgba(114, 189, 153, 0.12),
                inset 0 1px 1px rgba(255, 255, 255, 0.2),
                inset 0 -2px 4px rgba(0, 0, 0, 0.2) !important;
        }

        /* Nombre en modo RMK: grande pero nunca mayor que el logo del municipio */
        .nombre-farmacia--rmk {
            font-size: clamp(2rem, 12vw, 3.8rem);
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        /* Separador visual entre secciones */
        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.13), transparent);
            margin: clamp(4px, 0.8vh, 8px) 0 0;
            flex-shrink: 0;
        }

        /* Acento verde en el h1 */
        .h1-accent {
            color: #72bd99;
            font-weight: 800;
        }

        /* Ícono de calendario en la fecha */
        .fecha::before {
            content: '\f073';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            margin-right: 7px;
            opacity: 0.65;
            font-size: 0.8rem;
            vertical-align: middle;
        }

        /* Estilos del Anuncio PWA Sutil */
        .pwa-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 28, 45, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(114, 189, 153, 0.3);
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 92%;
            max-width: 380px;
            animation: pwaSlideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes pwaSlideUp {
            from { transform: translate(-50%, 150%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .pwa-banner img {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            object-fit: contain;
            background: rgba(255,255,255,0.1);
            padding: 4px;
        }

        .pwa-text { flex: 1; }
        .pwa-text span {
            display: block;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .pwa-text p {
            color: rgba(255,255,255,0.6);
            font-size: 0.7rem;
            margin: 0;
        }

        .pwa-actions { display: flex; gap: 8px; }
        .pwa-btn-install {
            background: var(--primary);
            color: #0a1628;
            border: none;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
        }
        .pwa-btn-close {
            background: transparent;
            color: rgba(255,255,255,0.4);
            border: none;
            font-size: 0.7rem;
            cursor: pointer;
            padding: 5px;
        }

    </style>
</head>

<script>
    // Ocultar loader cuando la página esté lista
    window.addEventListener('load', () => {
        setTimeout(() => {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.classList.add('hidden');
                setTimeout(() => loader.remove(), 600);
            }
        }, 800);
    });


    // Background particles
    const particleLayer = document.getElementById('bg-particles');
    const particleCount = 25;
    const colors = ['#72bd99', '#5da684', '#4a9a7f', '#3d7f65', '#2d6f55'];

    for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'bg-particle';
        const size = 4 + Math.random() * 12;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const left = Math.random() * 100;
        const duration = 15 + Math.random() * 20;
        const delay = Math.random() * -duration;
        
        particle.style.cssText = `
            width: ${size}px;
            height: ${size}px;
            background: ${color};
            left: ${left}%;
            top: 100%;
            opacity: ${0.1 + Math.random() * 0.15};
            animation-duration: ${duration}s;
            animation-delay: ${delay}s;
            box-shadow: 0 0 ${size * 2}px ${color};
        `;
        particleLayer.appendChild(particle);
    }

    const emojis = ['⏰','💊','🏥','⏱️','🧾','💉','🩺','💊','🌡️','🔬','🩹','❤️‍🩹','🫀','🧬','🩻','⚕️'];
    const layer = document.getElementById('emoji-layer');

    for (let i = 0; i < 55; i++) {
        const emojiDiv = document.createElement('div');
        emojiDiv.className = 'emoji-floating';
        emojiDiv.innerText = emojis[Math.floor(Math.random()*emojis.length)];

        // Mezcla de tamaños: algunos grandes destacados, mayoría medianos
        const grande = Math.random() < 0.2;
        const size = grande ? (2.2 + Math.random() * 1.2) : (0.9 + Math.random() * 1.1);
        emojiDiv.style.fontSize = `${size}rem`;
        emojiDiv.style.top  = `${Math.random() * 100}%`;
        emojiDiv.style.left = `${Math.random() * 100}%`;

        const duration = 7 + Math.random() * 10;
        const delay = Math.random() * -duration;
        emojiDiv.style.animationDuration = `${duration}s, ${10 + Math.random() * 8}s`;
        emojiDiv.style.animationDelay = `${delay}s, ${delay}s`;
        // Opacidad variada: algunos más visibles que otros
        const opacidad = grande ? (0.18 + Math.random() * 0.18) : (0.10 + Math.random() * 0.14);
        emojiDiv.style.opacity = opacidad.toString();

        layer.appendChild(emojiDiv);
    }
</script>
